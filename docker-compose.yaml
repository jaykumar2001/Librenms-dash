services:
  librenms-dash:
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-}
    container_name: librenms-dash
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - LIBRENMS_URL=${LIBRENMS_URL:-https://librenms.local.lan}
      - LIBRENMS_TOKEN=${LIBRENMS_TOKEN}
      - AUTH_USERNAME=${AUTH_USERNAME}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - PORT=3001
      - NODE_ENV=production
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      # Network ranges — configure to match your deployment (see .env.example).
      - ZEROTIER_SUBNETS=${ZEROTIER_SUBNETS:-}
      - WIREGUARD_SUBNETS=${WIREGUARD_SUBNETS:-}
      - TAILSCALE_SUBNETS=${TAILSCALE_SUBNETS:-}
      - ARP_EXCLUDED_SUBNETS=${ARP_EXCLUDED_SUBNETS:-}
      - DOCKER_SUBNETS=${DOCKER_SUBNETS:-}
      - LIBRENMS_USER=${LIBRENMS_USER:-}
      - LIBRENMS_PASS=${LIBRENMS_PASS:-}
    # Host resolution for the LibreNMS hostname and the upstream DNS server. These
    # are ignored under network_mode: host (the container uses the host's resolver),
    # and otherwise default to harmless placeholders — set them in .env if needed.
    extra_hosts:
      - "${LIBRENMS_HOSTNAME:-librenms.local.lan}:${LIBRENMS_HOST_IP:-127.0.0.1}"
    network_mode: host
    dns:
      - ${LOCAL_DNS:-1.1.1.1}
