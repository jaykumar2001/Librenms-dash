name: CI

on:
  push:
    branches:
      - main
      - security/hashed-auth-and-docker-secrets
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run backend tests
        run: corepack pnpm --filter backend test

      - name: Build frontend
        run: corepack pnpm --filter frontend build

      - name: Build backend
        run: corepack pnpm --filter backend build

      - name: Smoke-test real backend with synthetic secrets and mock API
        run: node scripts/smoke-test.mjs

      - name: Build application Docker stage
        run: docker build --target build -t librenms-dash:ci-build .
